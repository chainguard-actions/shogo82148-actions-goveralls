name: Test parallel-finished
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare Go env fallback (avoid `go env` if go is missing)
        run: |
          if ! command -v go >/dev/null 2>&1; then
            for v in GOROOT GOPATH GOBIN GOTMPDIR GOTOOLDIR GOCACHE; do
              mkdir -p "/tmp/fakego/$v"
              echo "$v=/tmp/fakego/$v" >> "$GITHUB_ENV"
            done
            echo "GOOS=linux" >> "$GITHUB_ENV"
            case "$(uname -m)" in
              aarch64|arm64) echo "GOARCH=arm64" >> "$GITHUB_ENV" ;;
              *) echo "GOARCH=amd64" >> "$GITHUB_ENV" ;;
            esac
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          parallel-finished: "true"
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: parallel build finished"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo cannot be resolved by Coveralls)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
