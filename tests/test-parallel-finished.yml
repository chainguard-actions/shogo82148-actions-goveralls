name: Test parallel-finished scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run goveralls action with parallel-finished (expect failure - no real Coveralls account)
        uses: .
        with:
          github-token: ${{ github.token }}
          parallel-finished: true
          shallow: true
        continue-on-error: true

      - name: Assert action ran with parallel-finished flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with a Coveralls API error.
          # It should NOT fail with "binary not found" or argument parsing errors.
          # Both 'success' and 'failure' are acceptable since we have no real Coveralls account.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with parallel-finished (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
