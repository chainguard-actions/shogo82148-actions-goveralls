name: Test with coverage profile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Go coverage profile
        run: |
          mkdir -p /tmp/coverage
          cat > /tmp/coverage/cover.out << 'EOF'
          mode: set
          github.com/example/pkg/foo.go:1.20,3.2 1 1
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          path-to-profile: /tmp/coverage/cover.out
          shallow: true

      - name: Assert action ran with profile (succeeds or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with profile"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
