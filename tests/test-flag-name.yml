name: Test flag-name input for parallel jobs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal coverage profile
      - name: Create coverage profile
        run: |
          mkdir -p /tmp/gotest
          cat > /tmp/gotest/coverage.out <<'EOF'
          mode: set
          EOF

      - id: action
        name: Run goveralls action with flag-name and parallel
        uses: .
        with:
          github-token: ${{ github.token }}
          path-to-profile: /tmp/gotest/coverage.out
          parallel: true
          flag-name: Unit
          shallow: true
        continue-on-error: true

      - name: Assert action ran with flag-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with a Coveralls API error.
          # It should NOT fail with argument parsing errors for flag-name.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with flag-name (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
