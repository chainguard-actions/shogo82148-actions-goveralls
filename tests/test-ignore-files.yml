name: Test ignore files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake coverage profile with multiple files
        run: |
          mkdir -p /tmp/coverage
          cat > /tmp/coverage/cover.out <<'EOF'
          mode: set
          github.com/example/repo/main.go:1.1,2.1 1 1
          github.com/example/repo/generated.go:1.1,5.1 1 0
          github.com/example/repo/vendor/lib.go:1.1,3.1 1 0
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          path-to-profile: /tmp/coverage/cover.out
          ignore: generated.go,vendor/lib.go

      - name: Assert action ran with ignore input (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ignore input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / coveralls API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
